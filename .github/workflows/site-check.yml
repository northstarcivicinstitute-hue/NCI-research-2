name: Site check

# Runs on every push and pull request, including files added through
# GitHub's "Add files via upload" page. A red X means the upload replaced
# a shared file with an older copy or broke a link; open the run to see why.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pages, links, shared CSS/JS and sitemap
        run: python3 .github/scripts/check_site.py
